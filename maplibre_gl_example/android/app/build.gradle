plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "org.maplibre.example"
    compileSdkVersion 35
    ndkVersion "28.1.13356709"

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        
        // Enable experimental triangle layers
        manifestPlaceholders = [
            enableExperimentalTriangleLayers: true
        ]
        
        // Temporarily disable native CMake arguments
        // externalNativeBuild {
        //     cmake {
        //         cppFlags "-std=c++14"
        //         arguments "-DANDROID_STL=c++_shared"
        //     }
        // }
    }
    
    // Temporarily disable native build to fix CMake issues
    // externalNativeBuild {
    //     cmake {
    //         path "src/main/cpp/CMakeLists.txt"
    //         version "3.10.2"
    //     }
    // }

    buildTypes {
        debug {
            // Enable experimental triangle layers for debug builds
            buildConfigField "boolean", "ENABLE_EXPERIMENTAL_TRIANGLE_LAYERS", "true"
            // Set system property for triangle layers
            manifestPlaceholders.put("enableTriangleLayers", "true")
        }
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
            // Enable experimental triangle layers for release builds too
            buildConfigField "boolean", "ENABLE_EXPERIMENTAL_TRIANGLE_LAYERS", "true"
            manifestPlaceholders.put("enableTriangleLayers", "true")
        }
    }
}

flutter {
    source '../..'
}
